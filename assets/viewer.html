<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'">
<title>Agent Trace — __TRACE_TITLE__</title>
<style>
__DOCUMENT_CSS__
</style>
<style>
:root {
  color-scheme: light;
  --trace-label-width: clamp(225px, 30vw, 410px);
  --trace-tool: var(--mb-ink-body);
  --trace-model: var(--mb-link);
  --trace-conversation: var(--mb-muted);
  --trace-error: var(--mb-accent);
}

@media screen {
  :root[data-theme="dark"] {
    color-scheme: dark;
    --mb-bg: #15171A;
    --mb-surface: #202327;
    --mb-ink: #F3F4F6;
    --mb-ink-body: #E2E5E9;
    --mb-border: #777F89;
    --mb-rule: #41464E;
    --mb-muted: #B4BDC8;
    --mb-faint: #929CA8;
    --mb-link: #79BFFC;
    --mb-accent: #FF8D81;
  }
}

.mb-page.trace-page {
  max-width: 1520px;
  padding: 32px clamp(16px, 4vw, 48px) 40px;
}

.trace-page .mb-header {
  position: relative;
  align-items: center;
  gap: 12px 24px;
  flex-wrap: wrap;
  margin-bottom: 20px;
}

.header-actions {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 8px;
}

.session-info {
  max-width: 100%;
}

.session-info > summary {
  padding: 4px 12px;
  background: var(--mb-surface);
  border: var(--mb-border-w) solid var(--mb-border);
  border-radius: 8px;
  font-size: 14px;
  cursor: pointer;
}

.session-panel.mb-card {
  position: absolute;
  z-index: 3;
  inset-inline-end: 0;
  top: 100%;
  width: min(42rem, 100%);
  margin: 8px 0 0;
  overflow-wrap: anywhere;
}

.session-panel p {
  margin: 8px 0;
  font-size: 13px;
}
#agent-usage { max-height: 48vh; overflow-y: auto; }

.trace-card.mb-card { padding: 0; margin: 0; }
.timeline-head { padding: 20px 24px 12px; }
.timeline-head h2 { margin: 0 0 6px; }
#overview-meta { margin: 0 0 12px; }

.overview.mb-figure-frame {
  padding: 8px 12px;
  background: var(--mb-bg);
  border: 1px solid var(--mb-rule);
}

.lane {
  display: grid;
  grid-template-columns: 100px minmax(0, 1fr);
  align-items: center;
  min-height: 22px;
  font-size: 12px;
  color: var(--mb-muted);
}

.rail {
  position: relative;
  height: 100%;
  border-inline-end: 1px solid var(--mb-rule);
  background: repeating-linear-gradient(to right, var(--mb-rule) 0 1px, transparent 1px 25%);
}

.rail i {
  position: absolute;
  top: 50%;
  height: 6px;
  border-radius: 2px;
  transform: translateY(-50%);
}

.overview-by-agent .lane {
  grid-template-columns: minmax(0, min(180px, 40%)) minmax(0, 1fr);
  min-height: 27px;
  border-bottom: 1px solid var(--mb-rule);
}

.overview-by-agent .lane:last-child { border-bottom: 0; }
.overview-by-agent .rail i { height: 3px; }
.overview-by-agent .rail .overview-turn {
  top: 50%;
  height: 17px;
  border: 1px solid var(--mb-rule);
  background: var(--mb-surface);
}
.overview-by-agent .rail .overview-tool { top: 25%; }
.overview-by-agent .rail .overview-model { top: 50%; }
.overview-by-agent .rail .overview-conversation { top: 75%; }
.overview-by-agent .rail .overview-error { top: 25%; height: 5px; }

.overview-by-agent .lane .overview-owner {
  padding: 3px 8px 3px calc(4px + min(var(--agent-depth) * 10px, 30px));
  border: 0;
  border-radius: 0;
  background: transparent;
  color: var(--mb-ink-body);
  font-size: 12px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.overview-by-agent .overview-owner:hover,
.overview-by-agent .overview-owner[aria-pressed="true"] {
  background: color-mix(in srgb, var(--mb-link) 10%, var(--mb-surface));
}
.overview-by-agent .overview-axis { min-height: 25px; }
.overview-axis .tick { top: 2px; }

button, select, input { font: inherit; color: inherit; }

button, select, input[type="search"] {
  padding: 5px 9px;
  border: 1px solid var(--mb-border);
  border-radius: 6px;
  background: var(--mb-surface);
  font-size: 13px;
  line-height: 1.5;
}

button { cursor: pointer; text-align: left; }
button:hover { background: var(--mb-bg); }
button[aria-current="true"], #theme-toggle[aria-pressed="true"] {
  background: color-mix(in srgb, var(--mb-link) 10%, var(--mb-surface));
}
button[aria-current="true"] {
  box-shadow: inset 3px 0 var(--mb-link);
}
#theme-toggle {
  display: inline-flex;
  align-items: center;
  gap: 6px;
}
#theme-toggle svg { width: 15px; height: 15px; }
button:disabled { cursor: default; opacity: .45; }
:focus-visible { outline: 2px solid var(--mb-link); outline-offset: 2px; }

.controls, .legend, .timeline-foot {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 6px 10px;
}

.controls { margin-top: 12px; }
.controls:empty { display: none; }
.controls input[type="search"] { min-width: 0; width: min(175px, 100%); }
#agent-filter { min-width: 0; max-width: min(20rem, 100%); }

.controls .icon-button {
  display: grid;
  place-items: center;
  width: 31px;
  height: 31px;
  padding: 0;
}

.icon-button svg { width: 15px; height: 15px; }
#analysis-limits { font-size: 13px; color: var(--mb-muted); }

.legend, .timeline-foot {
  padding: 8px 24px;
  color: var(--mb-muted);
  font-size: 12px;
}

.swatch {
  display: inline-block;
  width: 11px;
  height: 7px;
  border-radius: 2px;
  margin-inline-end: 4px;
  background: var(--trace-conversation);
}

.swatch.tool { background: var(--trace-tool); }
.swatch.model { background: var(--trace-model); }
.swatch.error { background: var(--trace-error); }
.swatch.point { width: 7px; transform: rotate(45deg); }

.scroll { overflow: auto; max-height: 58vh; border-block: 1px solid var(--mb-rule); }

.axis, .row {
  display: grid;
  grid-template-columns: var(--trace-label-width) minmax(0, 1fr);
  width: 100%;
}

.axis {
  position: sticky;
  top: 0;
  z-index: 2;
  min-height: 33px;
  background: var(--mb-bg);
  border-bottom: 1px solid var(--mb-border);
  font-size: 13px;
  font-weight: 700;
}

.axis > span { padding: 5px 12px; }
.axis-track, .track { margin: 0 15px 0 9px; position: relative; }
.tick {
  position: absolute;
  top: 6px;
  transform: translateX(-50%);
  white-space: nowrap;
}

.tick, .row-time, .row-tokens, #range {
  color: var(--mb-muted);
  font-family: var(--mb-font-mono);
  font-size: 12px;
  font-weight: 400;
  font-variant-numeric: tabular-nums;
}

.tick:first-child { transform: none; }
.tick:last-child:not(:first-child) { transform: translateX(-100%); }

.row {
  min-height: 36px;
  padding: 0;
  border: 0;
  border-radius: 0;
  border-bottom: 1px solid var(--mb-rule);
}
.row:last-child { border-bottom: 0; }
.row:focus-visible { outline-offset: -2px; }

.row-label {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 6px 8px 6px 12px;
  min-width: 0;
  border-inline-end: 1px solid var(--mb-rule);
}

.row-description { min-width: 0; display: grid; }
.row-owner { font-size: 11px; color: var(--mb-muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row-metrics { display: grid; margin-inline-start: auto; flex: none; text-align: end; }
.row-tokens { white-space: nowrap; }
.row-tokens.maximum { font-weight: 700; }
.row-note { font-size: 12px; color: var(--mb-muted); overflow-wrap: anywhere; }
.message-preview {
  display: -webkit-box;
  -webkit-box-orient: vertical;
  -webkit-line-clamp: 2;
  overflow: hidden;
  overflow-wrap: anywhere;
  font-size: 12px;
  color: var(--mb-muted);
}
.message-body {
  white-space: pre-wrap;
  overflow-wrap: anywhere;
}
.file-preview { font-family: var(--mb-font-mono); }

.track { display: block; }
.gridline { position: absolute; inset-block: 0; border-left: 1px solid var(--mb-rule); pointer-events: none; }

.mark {
  position: absolute;
  top: 50%;
  transform: translateY(-50%);
  height: 9px;
  min-width: 2px;
  border-radius: 2px;
  background: var(--trace-conversation);
}

.mark[data-kind="tool"], .mark[data-kind="command"], .mark[data-kind="file_change"], .mark[data-kind="agent"] { background: var(--trace-tool); }
.mark[data-kind="model"], .mark[data-kind="reasoning"], .mark[data-kind="compaction"] { background: var(--trace-model); }
.mark[data-kind="turn"] { background: transparent; border: 1px solid var(--trace-conversation); }
.mark[data-failed="true"] { background: var(--trace-error); }
.mark.point { height: 7px; width: 7px; border-radius: 1px; transform: translate(-50%, -50%) rotate(45deg); }

.untimed { padding: 0 24px 8px; }
.untimed summary { cursor: pointer; }
.result-list { display: grid; gap: 4px; margin: 8px 0; }
.result-list button { overflow-wrap: anywhere; }
.notice { font-size: 12px; color: var(--mb-muted); overflow-wrap: anywhere; }

.inspector.mb-card {
  position: fixed;
  z-index: 4;
  right: 16px;
  bottom: 16px;
  width: min(640px, calc(100vw - 32px));
  max-height: 76vh;
  margin: 0;
  padding: 16px 20px;
  overflow: auto;
  overflow-wrap: anywhere;
  box-shadow: 0 4px 18px #0002;
}

.inspector h2 { margin: 0 0 12px; }
.inspector h3 { margin: 12px 0 4px; font-size: 15px; }
.inspector dl { margin: 12px 0 0; }
.inspector dt { color: var(--mb-muted); font-size: 12px; }
.inspector dd { margin: 0 0 6px; font-variant-numeric: tabular-nums; }
.inspector pre {
  margin: 0 0 8px;
  padding: 8px 12px;
  background: var(--mb-bg);
  border-color: var(--mb-rule);
  font-family: var(--mb-font-mono);
  white-space: pre-wrap;
  overflow-wrap: anywhere;
  max-height: 260px;
  overflow: auto;
}
#dismiss { float: right; }

@media (max-width: 630px) {
  :root { --trace-label-width: 46%; }
  .mb-page.trace-page { padding-top: 16px; }
  .timeline-head { padding: 14px 12px 8px; }
  .legend, .timeline-foot, .untimed { padding-inline: 12px; }
  .lane { grid-template-columns: 88px minmax(0, 1fr); }
  .tick:nth-child(even) { display: none; }
  .row-time, .row-tokens, .tick { font-size: 10px; }
}

@media (max-width: 410px) {
  .row-label { flex-wrap: wrap; gap: 0; }
  .row-description { width: 100%; }
  .row-metrics { margin-inline-start: 0; text-align: start; }
}

@media print {
  .mb-page.trace-page { max-width: none; padding: 0; }
  .trace-card.mb-card { break-inside: auto; }
  .scroll { max-height: none; overflow: visible; }
  .axis { position: static; }
  .row { break-inside: avoid; }
  .controls, .timeline-foot button, .inspector, #theme-toggle { display: none; }
  .mark, .rail i, .swatch { print-color-adjust: exact; }
}
</style>
</head>
<body>
<div class="mb-page trace-page">
<header class="mb-header">
  <h1>Agent Trace</h1>
  <div class="header-actions">
    <details class="session-info">
      <summary>セッション情報</summary>
      <div class="mb-card session-panel">
        <p id="identity"></p>
        <p id="source" class="mb-meta-line"></p>
        <p id="measurement"></p>
        <p id="session-usage"></p>
        <div id="agent-usage" hidden></div>
      </div>
    </details>
    <button id="theme-toggle" type="button" aria-pressed="false">
      <svg aria-hidden="true" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round">
        <path d="M13.8 9.1a5.9 5.9 0 0 1-6.9-6.9 5.9 5.9 0 1 0 6.9 6.9Z"/>
      </svg>
      ダークモード
    </button>
  </div>
</header>
<main>
  <div class="workspace">
    <section class="mb-card trace-card" aria-labelledby="timeline-title">
      <div class="timeline-head">
        <h2 id="timeline-title">実行タイムライン</h2><p id="overview-meta" class="mb-meta-line"></p>
        <div id="overview" class="mb-figure-frame overview" aria-label="セッション全体の時間軸"></div>
        <p id="analysis-limits" hidden></p><div id="key-insights" class="controls"></div>
        <div class="controls">
          <select id="filter" aria-label="イベント種別"></select>
          <select id="agent-filter" aria-label="担当エージェント" hidden></select>
          <input id="query" type="search" aria-label="イベントを検索" placeholder="操作名、本文、イベントID">
          <button id="back" class="icon-button" type="button" aria-label="前の時間範囲"><svg aria-hidden="true" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="m10 3-5 5 5 5M5 8h8"/></svg></button>
          <button id="forward" class="icon-button" type="button" aria-label="次の時間範囲"><svg aria-hidden="true" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="m6 3 5 5-5 5M11 8H3"/></svg></button>
          <button id="zoom-in" class="icon-button" type="button" aria-label="拡大"><svg aria-hidden="true" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8h10M8 3v10"/></svg></button>
          <button id="zoom-out" class="icon-button" type="button" aria-label="縮小"><svg aria-hidden="true" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8h10"/></svg></button>
          <button id="fit" type="button">全体</button>
          <output id="range"></output>
        </div>
      </div>
      <div class="legend">
        <span><i class="swatch tool"></i>ツール</span>
        <span><i class="swatch model"></i>モデル・推論</span>
        <span><i class="swatch error"></i>エラー</span>
        <span><i class="swatch point"></i>イベント時刻</span>
      </div>
      <div class="scroll" id="scroll">
        <div class="chart">
          <div class="axis"><span>イベント</span><div id="axis" class="axis-track"></div></div>
          <div id="rows"></div>
        </div>
      </div>
      <div id="row-count" class="timeline-foot"></div>
      <details class="untimed" id="untimed"><summary id="untimed-title">時刻の記録がないイベント</summary><div id="untimed-rows" class="result-list"></div></details>
    </section>
    <aside hidden class="mb-card inspector" aria-labelledby="inspector-title">
      <button id="dismiss" type="button">閉じる</button><h2 id="inspector-title">イベント詳細</h2>
      <div id="inspector" aria-live="polite"><p class="muted">タイムラインからイベントを選択してください。</p></div>
    </aside>
  </div>
  <p class="notice" id="coverage"></p>
</main>
</div>
<script id="trace-data" type="application/json">__TRACE_DATA__</script>
<script>
(() => {
"use strict";
const data = JSON.parse(document.getElementById("trace-data").textContent);
const owners = data.sessions || [];
const multipleAgents = owners.length > 1;
const labelCounts = new Map();
for (const owner of owners) labelCounts.set(owner.label, (labelCounts.get(owner.label) || 0) + 1);
const byId = new Map(data.events.map(event => [event.id, event]));
const timed = data.events.filter(event => event.start != null).sort((a, b) => a.start - b.start || a.id - b.id);
const untimed = data.events.filter(event => event.start == null);
const pageSize = 300;
const rangeStart = data.range.start ?? 0;
// Fold only gaps bounded by consecutive recorded turns. An event or span
// inside the gap is evidence of activity, so keep that interval visible.
function turnBreaks(events) {
  const gaps = [];
  let lastEnd = null;
  for (const turn of events.filter(event => event.kind === "turn" && !event.session_index)) {
    if (lastEnd != null && turn.start > lastEnd) {
      gaps.push({start: lastEnd, end: turn.start});
    }
    lastEnd = turn.end == null ? null : Math.max(lastEnd ?? turn.end, turn.end);
  }
  let index = 0;
  let coveredUntil = -Infinity;
  return gaps.filter(gap => {
    while (index < events.length && events[index].start < gap.end) {
      const event = events[index++];
      coveredUntil = Math.max(coveredUntil, event.end ?? event.start);
    }
    return coveredUntil <= gap.start;
  });
}
const breaks = turnBreaks(timed);
let omitted = 0;
for (const gap of breaks) {
  omitted += gap.end - gap.start;
  gap.omittedThroughEnd = omitted;
}
function axisTime(timestamp) {
  let low = 0;
  let high = breaks.length;
  while (low < high) {
    const mid = Math.floor((low + high) / 2);
    if (breaks[mid].end <= timestamp) low = mid + 1;
    else high = mid;
  }
  return timestamp - rangeStart - (low ? breaks[low - 1].omittedThroughEnd : 0);
}
const elapsed = data.range.end == null ? null : axisTime(data.range.end);
const full = Math.max(0.001, elapsed ?? 0);
let left = 0;
let right = full;
let selection = null;
let timedPage = 0;
let untimedPage = 0;

const kinds = {
  primary: "主な操作と要確認箇所", all: "すべてのイベント", turn: "ターン", user: "ユーザー入力", assistant: "応答",
  tool: "ツール", file_change: "ファイル操作", result: "ツール結果", model: "モデル", reasoning: "推論", command: "コマンド", error: "エラー",
  compaction: "コンテキスト圧縮", agent: "サブエージェント",
};
const statusLabels = {
  started: "開始", completed: "完了", failed: "失敗", declined: "拒否", interrupted: "中断",
  interacted: "やり取り", async_launched: "バックグラウンドで開始", teammate_spawned: "チームに追加",
};
const stopReasonLabels = {end_turn: "応答完了", tool_use: "ツール呼び出し", max_tokens: "出力トークン上限", stop_sequence: "停止シーケンス"};
function statusLabel(status) { return statusLabels[status] || status; }
function readRangeText(range) {
  if (!range) return null;
  return [
    range.offset == null ? null : "開始行 " + fmt.format(range.offset),
    range.limit == null ? null : "最大 " + fmt.format(range.limit) + " 行",
  ].filter(Boolean).join(" ／ ");
}
const changeLabels = {add: "追加", update: "編集", delete: "削除"};
function fileTargets(operation) {
  if (!operation) return [];
  return [
    ...(operation.paths || []),
    ...(operation.changes || []).map(change => change.destination
      ? "移動元 " + change.path + " ／ 移動先 " + change.destination
      : (changeLabels[change.action] ? changeLabels[change.action] + " " : "") + change.path),
  ];
}
const tokenLabels = {input: "入力", output: "出力", cache_read: "キャッシュ読み込み",
  cache_write: "キャッシュ書き込み", reasoning: "推論", total: "記録合計"};
const timingLabels = {
  paired: "呼び出し・結果の時刻差", recorded: "記録された開始・終了", turn: "ターン全体",
  message: "メッセージ全体",
};
const warningLabels = {
  inherited_records_skipped: "子に引き継がれた記録を除外",
  inherited_history_unavailable: "重複判定に使う元の履歴を読み込めなかったセッション",
  subagents_unavailable: "読み込めなかった、または識別できなかった子セッション",
  empty_sessions_skipped: "表示対象がなくスキップしたセッション",
  invalid_record: "読めなかったレコード", invalid_interval: "不整合のある区間", unmatched_result: "対応する呼び出しがない結果",
  unmatched_tool: "終了が確認できないツール", inaccessible_sources: "読み込めなかったログ",
};
const el = id => document.getElementById(id);
const fmt = new Intl.NumberFormat("ja-JP", {maximumFractionDigits: 3});
const dollars = new Intl.NumberFormat("en-US", {style: "currency", currency: "USD", maximumFractionDigits: 8});
function node(tag, text, cssClass) {
  const item = document.createElement(tag);
  if (text != null) item.textContent = text;
  if (cssClass) item.className = cssClass;
  return item;
}
function button(text, action) {
  const item = node("button", text);
  item.type = "button";
  item.addEventListener("click", action);
  return item;
}
function axisLabel(seconds) {
  if (seconds == null) return "不明";
  if (seconds > 0 && seconds < 1) return fmt.format(seconds * 1000) + " ms";
  return fmt.format(seconds) + " s";
}
function time(seconds) {
  if (seconds == null) return "不明";
  const milliseconds = Math.max(0, Math.round(seconds * 1000));
  const hours = Math.floor(milliseconds / 3600000);
  const minutes = Math.floor(milliseconds / 60000) % 60;
  const wholeSeconds = Math.floor(milliseconds / 1000) % 60;
  const clock = [hours, minutes, wholeSeconds].map(value => String(value).padStart(2, "0")).join(":");
  return clock + "." + String(milliseconds % 1000).padStart(3, "0");
}
function eventStart(event) { return axisTime(event.start); }
function eventEnd(event) { return axisTime(event.end ?? event.start); }
function money(value) {
  if (value == null) return "不明";
  if (value > 0 && value < 0.00000001) return "$" + value.toExponential(2);
  return dollars.format(value);
}
function tokenParts(tokens) {
  return Object.entries(tokens).map(([key, value]) => tokenLabels[key] + " " + fmt.format(value));
}
function ownerName(index) {
  const owner = owners[index];
  if (!owner) return "";
  const shortId = owner.id.replace(/^agent-/, "").slice(0, 8);
  if (owner.label === owner.id) return "子 " + shortId;
  const label = owner.label.replace(/^\/root\//, "");

        drawOverviewSegments(rail, events.filter(event => event.kind !== "turn" && matchesLane(event)), type);
      }
      lane.append(selectOwner, rail);
      overview.append(lane);
      addLanes(index, depth + 1);
    }
  }
  addLanes(null, 0);
}

function drawOverview() {
  const overview = [data.session.agent, time(elapsed) + (breaks.length ? "（ターン間を除く）" : ""), data.counts.events + " イベント"];
  if (multipleAgents) overview.push("親と子 " + (owners.length - 1) + " セッション");
  el("overview-meta").textContent = overview.join("　 /　");
  if (multipleAgents) {
    drawAgentOverview(el("overview"));
    return;
  }
  for (const [label, type, matchesLane] of overviewLanes) {
    const lane = node("div", null, "lane");
    const rail = node("div", null, "rail");
    drawOverviewSegments(rail, timed.filter(matchesLane), type);
    lane.append(node("span", label), rail);
    el("overview").append(lane);
  }
}
drawOverview();
const checkpoints = [
  ["最も長い処理", data.longest[0]],
  ["エラーの記録", data.findings.find(f => f.kind === "error")],
  ["同じ結果の反復", data.findings.find(f => f.kind === "repeat")],
];
for (const [label, finding] of checkpoints) {
  if (!finding) continue;
  const event = byId.get(finding.event_ids[0]);
  const value = finding.seconds != null ? time(finding.seconds) : finding.count != null ? finding.count + "回" : data.counts.errors + "件";
  el("key-insights").append(button(label + "　" + (finding.seconds != null ? (event.action || event.label) + "　" : "") + value, () => selectEvent(event.id, true)));
}
fillSummary();
renderAxis();
renderRows();
const initialEvent = /^#event-(\d+)$/.exec(location.hash);
if (initialEvent) selectEvent(Number(initialEvent[1]), true);
})();
</script>
</body>
</html>
